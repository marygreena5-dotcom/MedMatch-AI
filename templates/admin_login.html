<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - MedMatch AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f3ff, #f5f0ff);
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .title {
            text-align: center;
            color: #243b64;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d5dbe5;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #5568d8;
        }

        .message {
            background: #ffecec;
            color: #d32f2f;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .back {
            text-align: center;
            margin-top: 22px;
        }

        .back a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .note {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            🔐
        </div>

        <h1 class="title">
            Admin Login
        </h1>

        <p class="subtitle">
            MedMatch AI Pharmacy Management
        </p>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <form method="POST" action="/admin-login">

            <label for="email">
                Admin Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter admin email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit" class="login-btn">
                Admin Login
            </button>

        </form>

        <div class="back">
            <a href="/">
                ← Back to MedMatch AI
            </a>
        </div>

        <p class="note">
            Authorized pharmacy administrators only.
        </p>

    </div>

</body>
</html>
