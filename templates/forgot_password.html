<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - MedMatch AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #dceeff, transparent 40%),
                radial-gradient(circle at bottom right, #eee5ff, transparent 40%),
                #f5f8ff;

            padding: 25px;
        }

        .forgot-container {

            width: 400px;

            background: rgba(255, 255, 255, 0.96);

            padding: 38px 40px;

            border-radius: 22px;

            box-shadow:
                0 15px 45px rgba(43, 63, 120, 0.14);

            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .logo {
            text-align: center;
            margin-bottom: 12px;
        }

        .logo img {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        .title {
            text-align: center;
            color: #243b64;
            font-size: 27px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #7a8190;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #303846;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #d8deea;
            border-radius: 10px;

            font-size: 14px;
            color: #303846;

            outline: none;
            background: #ffffff;

            margin-bottom: 20px;
        }

        input:focus {
            border-color: #667eea;

            box-shadow:
                0 0 0 3px rgba(102, 126, 234, 0.10);
        }

        input::placeholder {
            color: #a1a7b2;
        }

        .continue-btn {

            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #667eea,
                #5b6fe8
            );

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 7px 16px rgba(102, 126, 234, 0.22);
        }

        .continue-btn:hover {
            transform: translateY(-1px);
        }

        .back-login {

            text-align: center;

            margin-top: 22px;

            font-size: 13px;

            color: #707782;
        }

        .back-login a {

            color: #667eea;

            font-weight: 700;

            text-decoration: none;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        .security-note {

            text-align: center;

            margin-top: 18px;

            color: #9298a3;

            font-size: 11px;
        }

        .error-message {

            background: #fff5f5;

            border: 1px solid #ffd4d4;

            color: #c62828;

            border-radius: 9px;

            padding: 10px 12px;

            margin-bottom: 18px;

            font-size: 13px;

            line-height: 1.4;
        }

        @media (max-width: 480px) {

            body {
                padding: 18px;
            }

            .forgot-container {
                width: 100%;
                padding: 32px 25px;
            }

            .title {
                font-size: 25px;
            }
        }

    </style>

</head>

<body>

    <div class="forgot-container">

        <!-- MedMatch AI Logo -->

        <div class="logo">

            <img
                src="{{ url_for('static', filename='images/medmatch logo.png.png') }}"
                alt="MedMatch AI Logo"
            >

        </div>


        <!-- Heading -->

        <h1 class="title">
            Forgot Password?
        </h1>


        <p class="subtitle">
            Enter your registered email or mobile number
            to reset your password.
        </p>


        <!-- Error Message -->

        {% if message %}

        <div class="error-message">
            {{ message }}
        </div>

        {% endif %}


        <!-- Form -->

        <form method="POST" action="/forgot-password">

            <label for="email">
                Email or Mobile Number
            </label>

            <input
                type="text"
                id="email"
                name="email"
                placeholder="Enter your email or mobile number"
                required
            >


            <button
                type="submit"
                class="continue-btn"
            >
                Continue
            </button>

        </form>


        <!-- Back to Login -->

        <div class="back-login">

            Remember your password?

            <a href="/login">
                Back to Login
            </a>

        </div>


        <div class="security-note">

            🔒 Your account information is protected

        </div>

    </div>

</body>

</html>
