<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MedMatch AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f3ff, #f5f0ff);
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .title {
            text-align: center;
            color: #243b64;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d5dbe5;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #5568d8;
        }

        .forgot {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
        }

        .signup {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        .signup a {
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
        }

        .medical-note {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">💊</div>

        <h1 class="title">MedMatch AI</h1>

        <p class="subtitle">
            Intelligent Medicine Alternative Finder
        </p>

        <!-- Login Form -->
        <form method="POST" action="/login">

            <label for="email">Email or Mobile Number</label>

            <input
                type="text"
                id="email"
                name="email"
                placeholder="Enter your email or mobile number"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="signup">
            Don't have an account?
            <a href="/register">Create Account</a>
        </div>

        <p class="medical-note">
            For medicine information and availability support only.
            Consult a qualified healthcare professional before changing medicines.
        </p>

    </div>

</body>
</html>
