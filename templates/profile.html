<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MedMatch AI - My Profile</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7ff;
            color: #243b64;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 25px;
        }

        .profile-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .profile-icon {
            text-align: center;
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 30px;
        }

        .info {
            margin-bottom: 18px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
        }

        .info strong {
            display: block;
            margin-bottom: 5px;
            color: #4b5f88;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            text-decoration: none;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="profile-card">

        <div class="profile-icon">
            👤
        </div>

        <h1>My Profile</h1>

        <p class="subtitle">
            Your MedMatch AI account information
        </p>

        <div class="info">
            <strong>👤 Name</strong>
             {{ user["name"] }}
        </div>

        <div class="info">
            <strong>📧 Email</strong>
             {{ user["email"] }}
        </div>

        <div class="info">
            <strong>📱 Mobile</strong>
            {{ user["mobile"] }}
        </div>

        <div class="info">
            <strong>💊 Account Type</strong>
            MedMatch AI User
        </div>

        <a href="/dashboard" class="back">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
